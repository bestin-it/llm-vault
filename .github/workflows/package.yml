# Builds the installers on demand. They are uploaded as short-lived workflow artifacts only:
# installers are distributed from https://bestin-it.com/llm-vault/, not from GitHub Releases.
name: package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Windows installer + portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          ./packaging/windows/build-windows.ps1 -SkipTests
      - name: macOS app + DMG
        if: runner.os == 'macOS'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
        run: bash packaging/macos/build-macos.sh
      - name: Linux AppImage / deb / rpm
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-dev libfuse2
          cargo install cargo-deb cargo-generate-rpm
          curl -L -o /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
          bash packaging/linux/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: llm-vault-${{ runner.os }}
          path: dist/*
          retention-days: 7
